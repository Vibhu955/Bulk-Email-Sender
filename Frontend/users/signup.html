<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
</head>

<body>
    <h2> Signup here!</h2>
    <form id="forminput" action="submit" method="POST">

        <div class="container">
            <label for="name"><b>Name: </b></label> <br>
            <input type="text" placeholder="Enter name" name="name"><br><br>
            <label for="email"><b>Email: </b></label> <br>
            <input type="email" placeholder="Enter email" name="email"><br><br>

            <label for="password"><b>Password: </b></label><br>
            <input type="password" placeholder="Enter Password" name="password"><br><br>

            <label for="phone_number"><b>Phone No.: </b></label><br>
            <input type="number" placeholder="Phone no." name="phone_number"><br><br>

            <button type="submit">SignUp</button>
            <button type="button" class="cancelbtn">Cancel</button>

        </div>

        </div>
    </form>
    <script src="signup.js" type="module"></script>

</body>

</html>
